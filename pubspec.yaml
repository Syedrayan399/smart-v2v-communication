name: smart_v2v

description: SMART V2V Communication - vehicle-to-vehicle alert app

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  geolocator: ^13.0.2

  flutter_map: ^7.0.2

  latlong2: ^0.9.1

  socket_io_client: ^2.0.3+1

  http: ^1.2.2

  just_audio: ^0.10.3
  
  vibration: ^3.1.3
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/audio/image/v2v_logo.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  assets:
    - assets/audio/collision_warning_chicken_squawk.wav